name: Research
description: Analyze a source, such as an installer or a product's documentation, and record what it shows.
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: Research follows the rules in `AGENTS.md`. Each source gets its own page under `docs/research/`, and every claim cites a file and line range or a binary and function address.
  - type: input
    id: source
    attributes:
      label: Source and version
      description: For example "ConfigMgr 2509 installer".
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Where to get it
      description: The download link and SHA-256, if known.
  - type: textarea
    id: questions
    attributes:
      label: Questions
      description: What the research must answer, and which design decision each answer affects.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Research page
      description: For example `docs/research/configmgr-2509.md`.
