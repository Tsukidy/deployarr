name: Decision
description: A product or design question that only the repository owner can answer.
labels: ["decision", "needs-owner"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The question, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option and what it changes.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you recommend and why, if you have one.
  - type: input
    id: needed-before
    attributes:
      label: Needed before
      description: The milestone or issue that waits on the answer, for example M3.
