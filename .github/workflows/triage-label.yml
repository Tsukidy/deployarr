name: Triage label

# A new issue with no state label gets `needs-triage`, so nothing skips the
# queue. Tickets that agents write already carry a state label, and epics
# carry none on purpose, so this leaves both alone.
# Adapted from mattpocock/skills. See docs/agents/third-party-notices.md.

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    name: Triage label
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add needs-triage when the issue has no state label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          labels=$(gh issue view "$NUMBER" --json labels --jq '[.labels[].name] | join(",")')
          echo "Labels on #$NUMBER: ${labels:-none}"
          case ",$labels," in
            *,needs-triage,* | *,needs-info,* | *,ready-for-agent,* | *,ready-for-human,* | *,wontfix,* | *,epic,*)
              echo "It already has a state label or is an epic." ;;
            *)
              gh issue edit "$NUMBER" --add-label needs-triage ;;
          esac
