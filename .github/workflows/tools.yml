name: Tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the repository tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Test the PXE prototype
        working-directory: tools/pxe-prototype
        run: python3 -m unittest
