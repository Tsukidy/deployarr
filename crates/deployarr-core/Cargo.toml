[package]
name = "deployarr-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The crate is `no_std`, so every dependency must build without `std`. CI builds
# the crate for `x86_64-unknown-none`, which ships no `std`, to check this. Turn
# off a dependency's default features when they pull in `std`.
[dependencies]
# `form::Pattern` checks text values. The meta engine with the PikeVM matches
# in time linear in the text, and needs only `alloc`. `unicode` gives the
# Perl classes and case folding that `regex` patterns expect.
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "meta", "nfa-pikevm", "syntax", "unicode"] }
# `form::Pattern` anchors the parsed pattern to the whole value.
regex-syntax = { version = "0.8", default-features = false }
# `lifecycle` compares add-on versions by SemVer precedence, which ignores
# build metadata. `Version::cmp_precedence` first shipped in 1.0.20.
semver = { version = "1.0.20", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# `raw_value` keeps an add-on step's config as the JSON text that was saved.
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
serde_path_to_error = "0.1"
# `time`'s `formatting` feature needs `std`, so `condition::Timestamp` writes its
# own RFC 3339 text and uses `time` only to parse it.
time = { version = "0.3", default-features = false, features = ["parsing"] }
# `v5` derives the IDs of the nodes that `lower` adds. It needs no randomness.
uuid = { version = "1", default-features = false, features = ["serde", "v5"] }

[dev-dependencies]
# `tests/timestamp_json.rs` checks that `Timestamp` reads and writes the same
# JSON as `time::serde::rfc3339`. Test and clippy builds turn these features on
# for the library too. Only the `wasm32` and `x86_64-unknown-none` builds catch
# library code that needs them.
time = { version = "0.3", features = ["serde-well-known"] }
# `tests/compile_types.rs` shows that `compile` rejects an authored sequence.
trybuild = "1"
# `tests/form.rs` and `tests/prompt.rs` parse form fields and prompts from
# TOML, as a schema file and a manifest hold them.
toml = "1"
