[package]
name = "deployarr-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The crate is `no_std`, so every dependency must build without `std`. CI builds
# the crate for `x86_64-unknown-none`, which ships no `std`, to check this. Turn
# off a dependency's default features when they pull in `std`.
[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_path_to_error = "0.1"
# `time`'s `formatting` feature needs `std`, so `condition::Timestamp` writes its
# own RFC 3339 text and uses `time` only to parse it.
time = { version = "0.3", default-features = false, features = ["parsing"] }
uuid = { version = "1", default-features = false, features = ["serde"] }

[dev-dependencies]
# `tests/timestamp_json.rs` checks that `Timestamp` reads and writes the same
# JSON as `time::serde::rfc3339`.
time = { version = "0.3", features = ["serde-well-known"] }
