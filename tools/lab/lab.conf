# Settings that the lab scripts share. See docs/lab-setup.md.
# shellcheck shell=bash disable=SC2034

LAB_DIR=${LAB_DIR:-$HOME/deployarr-lab}

BRIDGE=br-lab
SERVER_IP=10.41.0.1
PREFIX=24
DHCP_RANGE=10.41.0.100,10.41.0.199,255.255.255.0,12h
RUN_DIR=/run/deployarr-lab

OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.ms.fd
OVMF_VARS_BLANK=/usr/share/OVMF/OVMF_VARS_4M.fd
OVMF_VARS_MS=/usr/share/OVMF/OVMF_VARS_4M.ms.fd
OVMF_VARS_WIN23=$LAB_DIR/OVMF_VARS_4M.win23.fd

VMS=(uefi uefi2023 bios)
declare -A VM_FIRMWARE=([uefi]=uefi [uefi2023]=uefi [bios]=bios)
declare -A VM_VARS=([uefi]=$OVMF_VARS_MS [uefi2023]=$OVMF_VARS_WIN23)
declare -A VM_TAP=([uefi]=tap-uefi [uefi2023]=tap-uefi2023 [bios]=tap-bios)
declare -A VM_MAC=([uefi]=52:54:00:41:00:11 [uefi2023]=52:54:00:41:00:12 [bios]=52:54:00:41:00:21)
declare -A VM_UUID=(
    [uefi]=4c414200-0000-4000-8000-000000000011
    [uefi2023]=4c414200-0000-4000-8000-000000000012
    [bios]=4c414200-0000-4000-8000-000000000021
)
declare -A VM_VNC=([uefi]=1 [uefi2023]=2 [bios]=3)
